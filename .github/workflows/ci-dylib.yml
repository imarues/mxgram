name: Build Mx Dylib (Source Check)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Mx.bundle/**'
      - 'Makefile'
      - '.github/workflows/ci-dylib.yml'

permissions:
  contents: write

concurrency:
  group: mx-dylib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos and iOS SDK
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      - name: Compile Mx for sideload injection
        shell: bash
        run: make clean package FINALPACKAGE=1 STRIP=0

      - name: Upload Mx.dylib
        uses: actions/upload-artifact@v4
        with:
          name: Mx-iKiraPlus-dylib
          path: packages/Mx.dylib
          if-no-files-found: error

      - name: Upload tweak packages
        uses: actions/upload-artifact@v4
        with:
          name: Mx-iKiraPlus-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish downloadable Mx.dylib release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The latest source on main wins if older queued runs finish later.
          LATEST=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$GITHUB_SHA" != "$LATEST" ]; then
            echo "A newer main commit exists; skipping stale release."
            exit 0
          fi
          if ! gh release view mx-ikiraplus-latest >/dev/null 2>&1; then
            gh release create mx-ikiraplus-latest \
              --title "Mx iKiraPlus Latest" \
              --notes "Compiled iOS dylib. Includes video-to-voice and circular Video Notes (640x640), file picker fix, and custom badge."
          fi
          gh release upload mx-ikiraplus-latest packages/Mx.dylib --clobber
