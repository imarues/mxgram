name: Mx Dylib Fallback Build (macOS Latest)

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Mx.bundle/**'
      - 'Makefile'
      - '.github/workflows/ci-dylib-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

# Separate queue from the primary macOS 15 build. The first available
# macOS image can compile the exact same source, independently.
concurrency:
  group: mx-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fallback build on current macOS
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Show runner information
        shell: bash
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Set up Theos and iOS SDK
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      - name: Build both arm64 and arm64e
        shell: bash
        run: make clean package FINALPACKAGE=1 STRIP=0

      - name: Verify compiled dylib
        shell: bash
        run: |
          test -s packages/Mx.dylib
          file packages/Mx.dylib
          ls -lh packages/Mx.dylib

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: Mx-iKiraPlus-fallback-dylib
          path: packages/Mx.dylib
          if-no-files-found: error

      - name: Publish compiled dylib to latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$GITHUB_SHA" != "$LATEST" ]; then
            echo "Newer commit exists; artifact uploaded, skipping outdated release."
            exit 0
          fi
          if ! gh release view mx-ikiraplus-latest >/dev/null 2>&1; then
            gh release create mx-ikiraplus-latest \
              --title "Mx iKiraPlus Latest" \
              --notes "Compiled latest iOS tweak with voice/video-note and settings fixes."
          fi
          gh release upload mx-ikiraplus-latest packages/Mx.dylib --clobber
